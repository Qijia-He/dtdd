project: __PROJECT__
name: __RUN_NAME__
checkpoint_root_dir: __CHECKPOINT_ROOT__
continue_from_checkpoint: true

algorithm:
  sample_strategy: staleness_control
  sample_strategy_args:
    max_staleness: 2
  algorithm_type: on_policy_distill
  advantage_fn: multi_turn_opd
  repeat_times: 1
  advantage_fn_args:
    kl_coef: 1.0
  optimizer:
    lr: 1e-4

model:
  # Student model
  model_path: __STUDENT_MODEL__
  max_prompt_tokens: 10240
  max_response_tokens: 512
  lora_configs:
    - name: alfworld_lora
      lora_rank: 32
      lora_alpha: 32
      target_modules: all-linear

cluster:
  node_num: 1
  gpu_per_node: 4

buffer:
  total_steps: 400
  batch_size: 16
  train_batch_size: 32
  explorer_input:
    taskset:
      name: alfworld
      storage_type: file
      path: __DATA_DIR__/train_expert.jsonl
      split: train
      format:
        prompt_key: 'game_file'
      rollout_args:
        temperature: 1.0
        # Required by OPD workflow to compute student-teacher token logprob gap
        logprobs: 0
      workflow_args:
        max_env_steps: 30
    eval_tasksets:
      - name: alfworld_eval_seen
        storage_type: file
        path: __DATA_DIR__/test.jsonl
        split: test
        total_steps: 10
        task_selector:
          selector_type: random
          seed: 42
        format:
          prompt_key: 'game_file'
        rollout_args:
          temperature: 0.4
          logprobs: 0
      - name: alfworld_eval_unseen
        storage_type: file
        path: __DATA_DIR__/test_unseen.jsonl
        split: test
        total_steps: 10
        task_selector:
          selector_type: random
          seed: 42
        format:
          prompt_key: 'game_file'
        rollout_args:
          temperature: 0.4
          logprobs: 0
    default_workflow_type: 'OPD_alfworld_workflow'
  trainer_input:
    experience_buffer:
      name: alfworld_opd_buffer
      storage_type: queue
      path: 'sqlite:///__BUFFER_DIR__/alfworld_opd_lora1e4_v2_buffer.db'
      max_retry_times: 5
      max_retry_interval: 2

explorer:
  eval_interval: 40
  runner_per_model: 8
  max_timeout: 3600
  rollout_model:
    engine_num: 1
    tensor_parallel_size: 1
    # enable_thinking: false
    enable_prefix_caching: false
    enforce_eager: true
    dtype: bfloat16
    seed: 42
    gpu_memory_utilization: 0.45
    enable_chunked_prefill: true
  auxiliary_models:
    # Teacher model (GiGPO-7B, ALFWorld)
    - model_path: __TEACHER_MODEL__
      engine_num: 1
      # enable_thinking: false
      tensor_parallel_size: 1
      enable_prefix_caching: false
      enforce_eager: true
      dtype: bfloat16
      seed: 42
      max_model_len: 20480
      max_prompt_tokens: 16384
      max_response_tokens: 512
      gpu_memory_utilization: 0.4
  env_vars:
    TMPDIR: /dev/shm/tmp
    RAY_TMPDIR: /dev/shm/ray_tmp
    HF_HOME: __HF_HOME__
    HF_HUB_CACHE: __HF_HOME__/hub
    HF_DATASETS_CACHE: __HF_HOME__/datasets

synchronizer:
  sync_method: 'nccl'
  sync_style: 'dynamic_by_explorer'
  sync_interval: 1
  sync_timeout: 3600

trainer:
  # train_batch
  total_steps: 400
  save_interval: 20
  grad_clip: 1.0
  use_dynamic_bsz: true
  max_token_len_per_gpu: 6144
  ulysses_sequence_parallel_size: 2

monitor:
  monitor_type: wandb
